name: Alpha123 Monitor
on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [monitor, probe, test-mail]
        default: monitor
      trigger_source:
        type: choice
        options: [manual, cloudflare]
        default: manual
      scheduled_time:
        type: string
        required: false
      bootstrap:
        description: '仅首次部署且没有旧状态时选择 true；丢失旧状态时禁止重置'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: alpha123-monitor
  cancel-in-progress: false
jobs:
  monitor:
    # Select exactly one automatic scheduler; retain native cron as optional backup.
    if: >-
      github.event.repository.private == false &&
      (vars.MONITOR_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'monitor')) &&
      ((github.event_name == 'schedule' && (vars.SCHEDULER_SOURCE == '' || vars.SCHEDULER_SOURCE == 'github')) ||
       (github.event_name == 'workflow_dispatch' && (inputs.trigger_source != 'cloudflare' || vars.SCHEDULER_SOURCE == 'cloudflare')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - name: Record scheduler origin
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'github' }}
          SCHEDULED_TIME: ${{ inputs.scheduled_time }}
        run: |
          python - <<'PY'
          import os, json
          print(json.dumps({'event': os.environ['GITHUB_EVENT_NAME'], 'source': os.environ['TRIGGER_SOURCE'], 'scheduled_time': os.environ['SCHEDULED_TIME'], 'run_id': os.environ['GITHUB_RUN_ID']}))
          PY
      - name: Claim automatic scheduler tick
        id: tick
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'github' }}
          SCHEDULED_TIME: ${{ inputs.scheduled_time }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scheduler_guard.py
      - name: Run monitor or explicit test
        if: steps.tick.outputs.should_run == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BOOTSTRAP_STATE: ${{ inputs.bootstrap || 'false' }}
          RUN_MODE: ${{ inputs.mode || 'monitor' }}
        run: |
          case "$RUN_MODE" in
            probe) python monitor.py --probe ;;
            test-mail) python notifier.py ;;
            monitor) python monitor.py ;;
            *) exit 1 ;;
          esac
      - name: Check dispatch Token expiry
        if: always() && steps.tick.outputs.should_run == 'true' && (inputs.mode == 'monitor' || github.event_name == 'schedule')
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN_EXPIRES_AT: ${{ vars.DISPATCH_TOKEN_EXPIRES_AT }}
        run: python token_reminder.py
