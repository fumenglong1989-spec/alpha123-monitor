name: Alpha123 Monitor
on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [monitor, probe, test-mail]
        default: monitor
      bootstrap:
        description: '仅首次部署且没有旧状态时选择 true；丢失旧状态时禁止重置'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: alpha123-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event.repository.private == false && (github.event_name != 'schedule' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - name: Run monitor or explicit test
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BOOTSTRAP_STATE: ${{ inputs.bootstrap || 'false' }}
          RUN_MODE: ${{ inputs.mode || 'monitor' }}
        run: |
          case "$RUN_MODE" in
            probe) python monitor.py --probe ;;
            test-mail) python notifier.py ;;
            monitor) python monitor.py ;;
            *) exit 1 ;;
          esac
